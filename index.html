<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Nakamir Deployment Checklist</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
    color: white;
    overflow-x: hidden;
  }

  h1 {
    text-align: center;
    font-size: 3rem;
    text-shadow: 0 0 20px rgba(34,197,94,0.8);
    margin-bottom: 40px;
  }

  .checkbox-list {
    max-width: 900px;
    margin: auto;
    font-size: 1.5rem;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 18px 0;
    padding: 16px 22px;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    backdrop-filter: blur(6px);
  }

  input[type="checkbox"] {
    width: 28px;
    height: 28px;
    cursor: pointer;
    accent-color: #22c55e;
  }

  label {
    cursor: pointer;
    user-select: none;
    font-size: 1.35rem;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>Nakamir Deployment Checklist</h1>

<canvas id="confetti"></canvas>

<div class="checkbox-list">

  <div class="item">
    <input type="checkbox" id="c1">
    <label for="c1">Create prod resources for any dev resource that prod references</label>
  </div>

  <div class="item">
    <input type="checkbox" id="c2">
    <label for="c2">Ensure each org entry in Mongo has the correct metadata</label>
  </div>

  <div class="item">
    <input type="checkbox" id="c3">
    <label for="c3">Run database split again (wipes projects in Trial)</label>
  </div>

  <div class="item">
    <input type="checkbox" id="c4">
    <label for="c4">Deploy dev</label>
  </div>

  <div class="item">
    <input type="checkbox" id="c5">
    <label for="c5">Create an account to access each org’s projects</label>
  </div>

  <div class="item">
    <input type="checkbox" id="c6">
    <label for="c6">Go through the checklist flow for Trial</label>
  </div>

  <div class="item">
    <input type="checkbox" id="c7">
    <label for="c7">Automate the flow with Playwright</label>
  </div>

  <div class="item">
    <input type="checkbox" id="c8">
    <label for="c8">Refresh issue with new deployments to site (health check?)</label>
  </div>

  <div class="item">
    <input type="checkbox" id="c9">
    <label for="c9">Help with IaC</label>
  </div>

</div>

<script>
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  class Particle {
    constructor() {
      this.x = Math.random() * w;
      this.y = Math.random() * h / 2;
      this.size = Math.random() * 8 + 4;
      this.speedX = (Math.random() - 0.5) * 8;
      this.speedY = (Math.random() - 0.5) * 8;
      this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
      this.alpha = 1;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.alpha -= 0.02;
    }
    draw() {
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  function burstConfetti() {
    for (let i = 0; i < 150; i++) particles.push(new Particle());
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();

  // ----- STATE PERSISTENCE -----

  const checkboxes = document.querySelectorAll("input[type='checkbox']");

  // Load saved state
  checkboxes.forEach(cb => {
    const saved = localStorage.getItem(cb.id);
    if (saved === "true") cb.checked = true;
  });

  // Save state + trigger confetti
  checkboxes.forEach(cb => {
    cb.addEventListener("change", (e) => {
      localStorage.setItem(cb.id, cb.checked.toString());
      if (e.target.checked) burstConfetti();
    });
  });
</script>

</body>
</html>
