<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DB & Blob Migration</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
    color: white;
    overflow: hidden;
  }

  .wrapper {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 3rem;
    padding: 40px 60px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
  }

  input[type="checkbox"] {
    width: 55px;
    height: 55px;
    cursor: pointer;
    accent-color: #22c55e;
    transform: scale(1.3);
  }

  label {
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(34, 197, 94, 0.7);
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="wrapper">
  <input type="checkbox" id="awsBox" />
  <label for="awsBox">DB & Blob Migration</label>
</div>

<script>
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  class Particle {
    constructor() {
      this.x = w / 2;
      this.y = h / 2;
      this.size = Math.random() * 8 + 4;
      this.speedX = (Math.random() - 0.5) * 8;
      this.speedY = (Math.random() - 0.5) * 8;
      this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
      this.alpha = 1;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.alpha -= 0.02;
    }
    draw() {
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  function burstConfetti() {
    for (let i = 0; i < 150; i++) {
      particles.push(new Particle());
    }
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }
  animate();

  document.getElementById("awsBox").addEventListener("change", (e) => {
    if (e.target.checked) burstConfetti();
  });
</script>

</body>
</html>
